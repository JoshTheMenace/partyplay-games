<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280" preserveAspectRatio="xMidYMid slice">
  <!-- Trolley Court: card back. Original art. A gavel over a railway crossbuck on navy. -->
  <defs>
    <pattern id="ties" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="28" height="28" fill="#1d2a6b"/>
      <rect x="0" y="10" width="28" height="7" fill="#24337f"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#3b4fb3"/>
      <stop offset="1" stop-color="#1d2a6b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="280" fill="url(#ties)"/>
  <rect width="200" height="280" fill="url(#glow)"/>
  <rect x="10" y="10" width="180" height="260" rx="14" fill="none" stroke="#fff6e5" stroke-width="4"/>
  <rect x="18" y="18" width="164" height="244" rx="10" fill="none" stroke="#ffd24a" stroke-width="2" stroke-dasharray="6 6"/>
  <g transform="translate(100 140)" stroke="#05071a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <circle r="62" fill="#0b1030" stroke="#ffd24a" stroke-width="6"/>
    <g transform="rotate(35)"><rect x="-50" y="-9" width="100" height="18" rx="4" fill="#fff6e5"/></g>
    <g transform="rotate(-35)"><rect x="-50" y="-9" width="100" height="18" rx="4" fill="#fff6e5"/></g>
    <g transform="rotate(-30)">
      <rect x="-6" y="-6" width="12" height="62" rx="5" fill="#b07a4a"/>
      <rect x="-28" y="-30" width="56" height="26" rx="8" fill="#ff5748"/>
      <rect x="-32" y="-32" width="10" height="30" rx="4" fill="#ffd24a"/>
      <rect x="22" y="-32" width="10" height="30" rx="4" fill="#ffd24a"/>
    </g>
  </g>
</svg>
